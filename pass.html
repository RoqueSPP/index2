<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gerador e Validador de CPF, CNPJ e Nomes</title>

  <style>
    :root {
      --bg: #f4f4f9;
      --card: #ffffff;
      --accent: #090b09;
      --muted: #777;
      --shadow: 0 6px 14px rgba(0,0,0,.08);
    }

    html,body{
      margin:0;
      font-family:Arial,sans-serif;
      background:var(--bg);
      color:#222;
    }

    .container{
      max-width:900px;
      margin:40px auto;
      padding:24px;
    }

    header{
      text-align:center;
      margin-bottom:18px;
    }

    .card{
      background:#fff;
      border-radius:14px;
      padding:20px;
      box-shadow:var(--shadow);
    }

    .generator{
      display:grid;
      gap:20px;
    }

    .row{
      display:grid;
      grid-template-columns:240px 1fr;
      gap:18px;
      align-items:center;
    }

    .left{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .right{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .small-btn{
      height:36px;
      padding:0 16px;
      border:none;
      border-radius:22px;
      background:#111;
      color:#fff;
      cursor:pointer;
      font-weight:bold;
      width:160px;
    }

    .display{
      flex:1;
      font-size:20px;
      padding:8px 14px;
      border-radius:12px;
      border:2px solid #ccc;
      text-align:center;
      background:#fff;
    }

    .controls{
      display:flex;
      gap:8px;
    }

    .btn{
      height:32px;
      padding:0 14px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      background:#2a2a2a;
      color:#fff;
      font-weight:bold;
    }

    .secondary{
      background:#fff;
      color:#222;
      border:1px solid #ccc;
    }

    .checkbox{
      display:flex;
      align-items:center;
      gap:6px;
    }

    #resultado{
      margin-top:10px;
      font-weight:bold;
      text-align:center;
    }

    .valido{ color:green; }
    .invalido{ color:red; }

    @media(max-width:640px){
      .row{
        grid-template-columns:1fr;
      }

      .right{
        flex-wrap:wrap;
      }

      .small-btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>Gerador e Validador</h1>
    <p>CPF, CNPJ, CNPJ Alfanumérico e Nomes</p>
  </header>

  <div class="card">

    <div class="generator">

      <!-- NOME -->
      <div class="row">

        <div class="left">
          <button class="small-btn" id="btn-gerar-nome">
            GERAR NOME
          </button>
        </div>

        <div class="right">

          <input
            id="nome-input"
            class="display"
            type="text"
            disabled
          >

          <div class="controls">
            <button class="btn" id="nome-copy">COPIAR</button>
            <button class="btn secondary" id="nome-regen">↺</button>
          </div>

        </div>

      </div>

      <!-- CNPJ -->
      <div class="row">

        <div class="left">

          <button class="small-btn" id="btn-gerar-cnpj">
            GERAR CNPJ
          </button>

          <div class="checkbox">
            <input type="checkbox" id="pontuar-cnpj" checked>
            <label>Pontuação</label>
          </div>

        </div>

        <div class="right">

          <input
            id="cnpj-input"
            class="display"
            type="text"
            disabled
          >

          <div class="controls">
            <button class="btn" id="cnpj-copy">COPIAR</button>
            <button class="btn secondary" id="cnpj-regen">↺</button>
          </div>

        </div>

      </div>

      <!-- CNPJ ALFANUMERICO -->
      <div class="row">

        <div class="left">

          <button class="small-btn" id="btn-gerar-cnpj-alpha">
            CNPJ ALFA
          </button>

          <div class="checkbox">
            <input type="checkbox" id="pontuar-cnpj-alpha" checked>
            <label>Pontuação</label>
          </div>

        </div>

        <div class="right">

          <input
            id="cnpj-alpha-input"
            class="display"
            type="text"
            disabled
          >

          <div class="controls">
            <button class="btn" id="cnpj-alpha-copy">COPIAR</button>
            <button class="btn secondary" id="cnpj-alpha-regen">↺</button>
          </div>

        </div>

      </div>

      <!-- CPF -->
      <div class="row">

        <div class="left">

          <button class="small-btn" id="btn-gerar-cpf">
            GERAR CPF
          </button>

          <div class="checkbox">
            <input type="checkbox" id="pontuar-cpf" checked>
            <label>Pontuação</label>
          </div>

        </div>

        <div class="right">

          <input
            id="cpf-input"
            class="display"
            type="text"
            disabled
          >

          <div class="controls">
            <button class="btn" id="cpf-copy">COPIAR</button>
            <button class="btn secondary" id="cpf-regen">↺</button>
          </div>

        </div>

      </div>

      <!-- VALIDAR CPF -->
      <div class="row">

        <div class="left">
          <button class="small-btn" onclick="verificarCPF()">
            VALIDAR CPF
          </button>
        </div>

        <div class="right">
          <input
            type="text"
            id="cpf"
            class="display"
            maxlength="14"
            placeholder="Digite o CPF"
          >
        </div>

      </div>

      <div id="resultado"></div>

    </div>

  </div>

</div>

<script>

  // =========================
  // NOME
  // =========================

  async function gerarNome() {

    const res = await fetch('https://randomuser.me/api/?nat=br');
    const data = await res.json();

    return `${data.results[0].name.first} ${data.results[0].name.last}`;
  }

  async function atualizarNome(){

    const input = document.getElementById('nome-input');

    input.value = 'Gerando...';

    try{
      input.value = await gerarNome();
    }catch{
      input.value = 'Erro';
    }
  }

  document.getElementById('btn-gerar-nome')
    .addEventListener('click', atualizarNome);

  document.getElementById('nome-regen')
    .addEventListener('click', atualizarNome);

  // =========================
  // COPIAR
  // =========================

  function copyToClipboard(text, el){

    navigator.clipboard.writeText(text);

    const original = el.textContent;

    el.textContent = 'COPIADO!';

    setTimeout(()=>{
      el.textContent = original;
    },1000);
  }

  // =========================
  // CNPJ
  // =========================

  function gerarCNPJ(pontuar){

    const d = Array.from({length:8},
      ()=>Math.floor(Math.random()*10));

    const calcDV = (base,pesos)=>{

      let soma = base.reduce(
        (acc,n,i)=>acc+n*pesos[i],0
      );

      let resto = soma % 11;

      return resto < 2 ? 0 : 11-resto;
    };

    const v0 = calcDV(
      [...d,0,0,0,1],
      [5,4,3,2,9,8,7,6,5,4,3,2]
    );

    const v1 = calcDV(
      [...d,0,0,0,1,v0],
      [6,5,4,3,2,9,8,7,6,5,4,3,2]
    );

    const cnpj = [...d,0,0,0,1,v0,v1];

    return pontuar
      ? `${cnpj.slice(0,2).join('')}.${cnpj.slice(2,5).join('')}.${cnpj.slice(5,8).join('')}/${cnpj.slice(8,12).join('')}-${cnpj.slice(12).join('')}`
      : cnpj.join('');
  }

  // =========================
  // CNPJ ALFANUMERICO
  // =========================

  function gerarCNPJAlfanumerico(pontuar){

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

    const pesos1 = [5,4,3,2,9,8,7,6,5,4,3,2];
    const pesos2 = [6,5,4,3,2,9,8,7,6,5,4,3,2];

    function randomChar(){
      return chars[
        Math.floor(Math.random()*chars.length)
      ];
    }

    function valorChar(c){
      return c.charCodeAt(0)-48;
    }

    function calcularDV(base,pesos){

      let soma = 0;

      for(let i=0;i<pesos.length;i++){
        soma += valorChar(base[i]) * pesos[i];
      }

      const resto = soma % 11;

      return resto < 2 ? 0 : 11-resto;
    }

    let base = '';

    for(let i=0;i<12;i++){
      base += randomChar();
    }

    const dv1 = calcularDV(base,pesos1);
    const dv2 = calcularDV(base+dv1,pesos2);

    const cnpj = base + dv1 + dv2;

    return pontuar
      ? `${cnpj.slice(0,2)}.${cnpj.slice(2,5)}.${cnpj.slice(5,8)}/${cnpj.slice(8,12)}-${cnpj.slice(12,14)}`
      : cnpj;
  }

  // =========================
  // CPF
  // =========================

  function gerarCPF(pontuar){

    const base = Array.from(
      {length:9},
      ()=>Math.floor(Math.random()*10)
    );

    const calcDV = (nums,peso)=>{

      let soma = nums.reduce(
        (acc,n,i)=>acc+n*(peso-i),0
      );

      let resto = soma % 11;

      return resto < 2 ? 0 : 11-resto;
    };

    const d1 = calcDV(base,10);
    const d2 = calcDV([...base,d1],11);

    const cpf = [...base,d1,d2];

    return pontuar
      ? `${cpf.slice(0,3).join('')}.${cpf.slice(3,6).join('')}.${cpf.slice(6,9).join('')}-${cpf.slice(9).join('')}`
      : cpf.join('');
  }

  // =========================
  // EVENTOS
  // =========================

  const cnpjInput = document.getElementById('cnpj-input');
  const cpfInput = document.getElementById('cpf-input');
  const cnpjAlphaInput = document.getElementById('cnpj-alpha-input');

  // CNPJ

  document.getElementById('btn-gerar-cnpj')
    .addEventListener('click',()=>{
      cnpjInput.value = gerarCNPJ(
        document.getElementById('pontuar-cnpj').checked
      );
    });

  document.getElementById('cnpj-regen')
    .addEventListener('click',()=>{
      cnpjInput.value = gerarCNPJ(
        document.getElementById('pontuar-cnpj').checked
      );
    });

  document.getElementById('cnpj-copy')
    .addEventListener('click',(e)=>{
      if(!cnpjInput.value) return;
      copyToClipboard(cnpjInput.value,e.currentTarget);
    });

  // CNPJ ALFA

  document.getElementById('btn-gerar-cnpj-alpha')
    .addEventListener('click',()=>{
      cnpjAlphaInput.value = gerarCNPJAlfanumerico(
        document.getElementById('pontuar-cnpj-alpha').checked
      );
    });

  document.getElementById('cnpj-alpha-regen')
    .addEventListener('click',()=>{
      cnpjAlphaInput.value = gerarCNPJAlfanumerico(
        document.getElementById('pontuar-cnpj-alpha').checked
      );
    });

  document.getElementById('cnpj-alpha-copy')
    .addEventListener('click',(e)=>{
      if(!cnpjAlphaInput.value) return;
      copyToClipboard(cnpjAlphaInput.value,e.currentTarget);
    });

  // CPF

  document.getElementById('btn-gerar-cpf')
    .addEventListener('click',()=>{
      cpfInput.value = gerarCPF(
        document.getElementById('pontuar-cpf').checked
      );
    });

  document.getElementById('cpf-regen')
    .addEventListener('click',()=>{
      cpfInput.value = gerarCPF(
        document.getElementById('pontuar-cpf').checked
      );
    });

  document.getElementById('cpf-copy')
    .addEventListener('click',(e)=>{
      if(!cpfInput.value) return;
      copyToClipboard(cpfInput.value,e.currentTarget);
    });

  // =========================
  // VALIDAR CPF
  // =========================

  function validarCPF(cpf){

    cpf = cpf.replace(/\D/g,'');

    if(cpf.length !== 11 ||
      /^(\d)\1+$/.test(cpf)) return false;

    let soma = 0;

    for(let i=0;i<9;i++){
      soma += parseInt(cpf[i]) * (10-i);
    }

    let resto = (soma*10)%11;

    if(resto===10) resto=0;

    if(resto !== parseInt(cpf[9])) return false;

    soma = 0;

    for(let i=0;i<10;i++){
      soma += parseInt(cpf[i]) * (11-i);
    }

    resto = (soma*10)%11;

    if(resto===10) resto=0;

    return resto === parseInt(cpf[10]);
  }

  function verificarCPF(){

    const cpf =
      document.getElementById('cpf').value;

    const resultado =
      document.getElementById('resultado');

    if(validarCPF(cpf)){

      resultado.textContent = '✅ CPF válido';
      resultado.className = 'valido';

    }else{

      resultado.textContent = '❌ CPF inválido';
      resultado.className = 'invalido';
    }
  }

</script>

</body>
</html>
