<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de CPFs e CNPJs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f4f9;
    }

    h1 {
      color: #333;
    }

    button {
      background-color: #090b09;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 5px;
    }

    button:hover {
      background-color: #2a2a2a;
    }

    input[type="text"] {
      font-size: 30px;
      text-align: center;
      margin: 20px 0;
      min-height: 40px;
      padding: 5px;
      width: 100%;
      border: 2px solid #cecece;
      box-shadow: 3px 4px 5px -1px rgba(0, 0, 0, 0.75);
    }

    label {
      font-size: 16px;
      display: block;
      margin-bottom: 5px;
    }

    .section {
      margin-bottom: 40px;
    }
  </style>
</head>

<body>
  <div class="section">
    <h1>Gerador de CNPJ</h1>
    <p>Gerador de CNPJ válidos</p>

    <input id="cnpj-input" type="text" disabled />
    <label><input type="checkbox" id="pontuar-cnpj" checked> Exibir com pontuação</label>
    <button onclick="gerarNovoCNPJ()">GERAR NOVO CNPJ</button>
  </div>

  <div class="section">
    <h1>Gerador de CPF</h1>
    <p>Gerador de CPF válidos</p>

    <input id="cpf-input" type="text" disabled />
    <label><input type="checkbox" id="pontuar-cpf" checked> Exibir com pontuação</label>
    <button onclick="gerarNovoCPF()">GERAR NOVO CPF</button>
  </div>

  <script>
    // Função para gerar CNPJ
    function gerarNovoCNPJ() {
      const pontuar = document.getElementById('pontuar-cnpj').checked;
      document.getElementById('cnpj-input').value = gerarCNPJ(pontuar);
    }

    function gerarCNPJ(pontuar) {
      const n = 9;
      const d = Array.from({ length: 8 }, () => Math.floor(Math.random() * 10));
      const v = [0, 0];

      const calcDV = (base, pesos) => {
        let soma = 0;
        for (let i = 0; i < base.length; i++) soma += base[i] * pesos[i];
        let resto = soma % 11;
        return resto < 2 ? 0 : 11 - resto;
      };

      v[0] = calcDV([...d, 0, 0, 0, 1], [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]);
      v[1] = calcDV([...d, 0, 0, 0, 1, v[0]], [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]);

      const cnpj = [...d, 0, 0, 0, 1, v[0], v[1]];

      if (pontuar) {
        return `${cnpj.slice(0, 2).join('')}.${cnpj.slice(2, 5).join('')}.${cnpj.slice(5, 8).join('')}/${cnpj.slice(8, 12).join('')}-${cnpj.slice(12).join('')}`;
      } else {
        return cnpj.join('');
      }
    }

    // Função para gerar CPF
    function gerarNovoCPF() {
      const pontuar = document.getElementById('pontuar-cpf').checked;
      document.getElementById('cpf-input').value = gerarCPF(pontuar);
    }

    function gerarCPF(pontuar) {
      const base = Array.from({ length: 9 }, () => Math.floor(Math.random() * 10));

      const calcDV = (nums, peso) => {
        let soma = 0;
        for (let i = 0; i < nums.length; i++) soma += nums[i] * (peso - i);
        let resto = soma % 11;
        return resto < 2 ? 0 : 11 - resto;
      };

      const d1 = calcDV(base, 10);
      const d2 = calcDV([...base, d1], 11);

      const cpf = [...base, d1, d2];

      if (pontuar) {
        return `${cpf.slice(0, 3).join('')}.${cpf.slice(3, 6).join('')}.${cpf.slice(6, 9).join('')}-${cpf.slice(9).join('')}`;
      } else {
        return cpf.join('');
      }
    }
  </script>
</body>
</html>
