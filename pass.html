<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gerador e Validador de CPF, CNPJ e Nomes</title>
  <style>
    :root {
      --bg: #f4f4f9;
      --card: #ffffff;
      --accent: #090b09;
      --muted: #777;
      --shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Arial", sans-serif;
      background: var(--bg);
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.3px;
    }

    header p {
      margin: 6px 0 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .generator {
      display: grid;
      gap: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 18px;
      align-items: center;
    }

    .left {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      flex-wrap: nowrap;
    }

    .small-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      border-radius: 22px;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
      transition: transform .08s ease, box-shadow .08s;
      width: 140px;
      text-align: center;
    }

    .small-btn:active { transform: translateY(1px); }

    .right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .display {
      flex: 1;
      font-size: 20px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 2px solid #cecece;
      box-shadow: 3px 4px 5px -1px rgba(0, 0, 0, 0.12);
      text-align: center;
      background: #fff;
      user-select: all;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      white-space: nowrap;
    }

    .btn {
      height: 32px;
      padding: 0 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: #2a2a2a;
      color: white;
      font-weight: 600;
      min-width: 80px;
    }

    .btn.secondary {
      background: transparent;
      color: #333;
      border: 1px solid #ddd;
      min-width: 34px;
      padding: 0 10px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }

    .help {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: var(--muted);
      font-size: 14px;
    }

    .contador {
      font-weight: bold;
      color: var(--accent);
    }

    #resultado {
      margin-top: 10px;
      font-weight: bold;
      font-size: 16px;
    }

    .valido { color: green; }
    .invalido { color: red; }

    @media (max-width: 640px) {
      .row { grid-template-columns: 1fr; }
      .left { flex-direction: column; align-items: stretch; }
      .small-btn { width: 100%; }
      .controls { flex-wrap: wrap; }
      .display { font-size: 18px; height: 28px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Gerador e Validador de CPF, CNPJ e Nomes</h1>
      <p>Gere nomes, números válidos e valide CPFs com facilidade.</p>
    </header>

    <div class="card">
      <div class="generator">
        <!-- GERADOR DE NOMES -->
        <div class="row">
          <div class="left">
            <button class="small-btn" id="btn-gerar-nome">GERAR NOME</button>
          </div>
          <div class="right">
            <input id="nome-input" class="display" type="text" placeholder="Gerar Nome..." disabled />
            <div class="controls">
              <button class="btn" id="nome-copy">COPIAR</button>
              <button class="btn secondary" id="nome-regen">↺</button>
            </div>
          </div>
        </div>

        <!-- GERADOR DE CNPJ -->
        <div class="row">
          <div class="left">
            <button class="small-btn" id="btn-gerar-cnpj">GERAR CNPJ</button>
            <div class="checkbox">
              <input type="checkbox" id="pontuar-cnpj" checked />
              <label for="pontuar-cnpj">Pontuação</label>
            </div>
          </div>
          <div class="right">
            <input id="cnpj-input" class="display" type="text" disabled />
            <div class="controls">
              <button class="btn" id="cnpj-copy">COPIAR</button>
              <button class="btn secondary" id="cnpj-regen">↺</button>
            </div>
          </div>
        </div>

        <!-- GERADOR DE CPF -->
        <div class="row">
          <div class="left">
            <button class="small-btn" id="btn-gerar-cpf">GERAR CPF</button>
            <div class="checkbox">
              <input type="checkbox" id="pontuar-cpf" checked />
              <label for="pontuar-cpf">Pontuação</label>
            </div>
          </div>
          <div class="right">
            <input id="cpf-input" class="display" type="text" disabled />
            <div class="controls">
              <button class="btn" id="cpf-copy">COPIAR</button>
              <button class="btn secondary" id="cpf-regen">↺</button>
            </div>
          </div>
        </div>
<!-- GERADOR DE CNPJ ALFANUMÉRICO -->
<div class="row">
  <div class="left">
    <button class="small-btn" id="btn-gerar-cnpj-alpha">CNPJ ALFA</button>
    <div class="checkbox">
      <input type="checkbox" id="pontuar-cnpj-alpha" checked />
      <label for="pontuar-cnpj-alpha">Pontuação</label>
    </div>
  </div>
  <div class="right">
    <input id="cnpj-alpha-input" class="display" type="text" disabled />
    <div class="controls">
      <button class="btn" id="cnpj-alpha-copy">COPIAR</button>
      <button class="btn secondary" id="cnpj-alpha-regen">↺</button>
    </div>
  </div>
</div>
        <!-- VALIDADOR DE CPF -->
        <div class="row">
          <div class="left">
            <button class="small-btn" onclick="verificarCPF()">VALIDAR CPF</button>
          </div>
          <div class="right">
            <input type="text" id="cpf" class="display" maxlength="14" placeholder="Digite o CPF para validar">
          </div>
        </div>
        <div id="resultado" style="text-align:center;"></div>
      </div>
    </div>

    <div class="help">
      Clique em <strong>GERAR</strong> ou no ícone ↺ para criar novos valores.<br>
      Use <strong>COPIAR</strong> para copiar o resultado.
    </div>

  </div>

  <script>
  // ---------- GERADOR DE NOMES ----------
  async function gerarNome() {
    const res = await fetch('https://randomuser.me/api/?nat=br');
    if (res.ok) {
      const data = await res.json();
      const nome = data.results[0].name.first;
      const sobreNome = data.results[0].name.last;
      return `${nome} ${sobreNome}`;
    } else {
      throw new Error("Erro ao gerar nome");
    }
  }

  async function atualizarNome() {
    const input = document.getElementById("nome-input");
    input.value = "Gerando...";
    try {
      const nome = await gerarNome();
      input.value = nome;
    } catch {
      input.value = "Erro ao gerar nome!";
    }
  }

  document.getElementById("btn-gerar-nome").addEventListener("click", atualizarNome);
  document.getElementById("nome-regen").addEventListener("click", atualizarNome);
  document.getElementById("nome-copy").addEventListener("click", () => {
    const input = document.getElementById("nome-input");
    if (input.value && !input.value.includes("Gerando")) {
      navigator.clipboard.writeText(input.value);
      alert("Nome copiado!");
    }
  });

  // ---------- GERADOR DE CNPJ ----------
  function gerarCNPJ(pontuar) {
    const d = Array.from({ length: 8 }, () => Math.floor(Math.random() * 10));
    const calcDV = (base, pesos) => {
      let soma = base.reduce((acc, n, i) => acc + n * pesos[i], 0);
      let resto = soma % 11;
      return resto < 2 ? 0 : 11 - resto;
    };
    const v0 = calcDV([...d, 0, 0, 0, 1], [5,4,3,2,9,8,7,6,5,4,3,2]);
    const v1 = calcDV([...d, 0, 0, 0, 1, v0], [6,5,4,3,2,9,8,7,6,5,4,3,2]);
    const cnpj = [...d, 0,0,0,1, v0, v1];
    return pontuar
      ? `${cnpj.slice(0,2).join('')}.${cnpj.slice(2,5).join('')}.${cnpj.slice(5,8).join('')}/${cnpj.slice(8,12).join('')}-${cnpj.slice(12).join('')}`
      : cnpj.join('');
  }

  // ---------- GERADOR DE CPF ----------
  function gerarCPF(pontuar) {
    const base = Array.from({ length: 9 }, () => Math.floor(Math.random() * 10));
    const calcDV = (nums, peso) => {
      let soma = nums.reduce((acc, n, i) => acc + n * (peso - i), 0);
      let resto = soma % 11;
      return resto < 2 ? 0 : 11 - resto;
    };
    const d1 = calcDV(base, 10);
    const d2 = calcDV([...base, d1], 11);
    const cpf = [...base, d1, d2];
    return pontuar
      ? `${cpf.slice(0,3).join('')}.${cpf.slice(3,6).join('')}.${cpf.slice(6,9).join('')}-${cpf.slice(9).join('')}`
      : cpf.join('');
  }

  // ---------- COPIAR ----------
  function copyToClipboard(text, el) {
    navigator.clipboard?.writeText(text).then(() => {
      const original = el.textContent;
      el.textContent = "COPIADO!";
      setTimeout(() => el.textContent = original, 900);
    });
  }

  const cnpjInput = document.getElementById('cnpj-input');
  const cpfInput = document.getElementById('cpf-input');

  document.getElementById('btn-gerar-cnpj').addEventListener('click', () => {
    cnpjInput.value = gerarCNPJ(document.getElementById('pontuar-cnpj').checked);
  });
  document.getElementById('cnpj-regen').addEventListener('click', () => {
    cnpjInput.value = gerarCNPJ(document.getElementById('pontuar-cnpj').checked);
  });
  document.getElementById('cnpj-copy').addEventListener('click', (e) => {
    if (!cnpjInput.value) return alert("Gere um CNPJ primeiro!");
    copyToClipboard(cnpjInput.value, e.currentTarget);
  });

  document.getElementById('btn-gerar-cpf').addEventListener('click', () => {
    cpfInput.value = gerarCPF(document.getElementById('pontuar-cpf').checked);
  });
  document.getElementById('cpf-regen').addEventListener('click', () => {
    cpfInput.value = gerarCPF(document.getElementById('pontuar-cpf').checked);
  });
  document.getElementById('cpf-copy').addEventListener('click', (e) => {
    if (!cpfInput.value) return alert("Gere um CPF primeiro!");
    copyToClipboard(cpfInput.value, e.currentTarget);
  });

  // ---------- VALIDADOR ----------
  function validarCPF(cpf) {
    cpf = cpf.replace(/\D/g, '');
    if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
    let soma = 0;
    for (let i = 0; i < 9; i++) soma += parseInt(cpf[i]) * (10 - i);
    let resto = (soma * 10) % 11;
    if (resto === 10 || resto === 11) resto = 0;
    if (resto !== parseInt(cpf[9])) return false;
    soma = 0;
    for (let i = 0; i < 10; i++) soma += parseInt(cpf[i]) * (11 - i);
    resto = (soma * 10) % 11;
    if (resto === 10 || resto === 11) resto = 0;
    if (resto !== parseInt(cpf[10])) return false;
    return true;
  }

  function verificarCPF() {
    const cpf = document.getElementById("cpf").value;
    const resultado = document.getElementById("resultado");
    if (validarCPF(cpf)) {
      resultado.textContent = "✅ CPF válido";
      resultado.className = "valido";
    } else {
      resultado.textContent = "❌ CPF inválido";
      resultado.className = "invalido";
    }
  }

// ---------- GERADOR DE CNPJ ALFANUMÉRICO ----------
function gerarCNPJAlfanumerico(pontuar) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

  const randomChar = () => chars[Math.floor(Math.random() * chars.length)];

  let base = '';
  for (let i = 0; i < 12; i++) {
    base += randomChar();
  }

  return pontuar
    ? `${base.slice(0,2)}.${base.slice(2,5)}.${base.slice(5,8)}/${base.slice(8,12)}`
    : base;
}

const cnpjAlphaInput = document.getElementById('cnpj-alpha-input');

document.getElementById('btn-gerar-cnpj-alpha').addEventListener('click', () => {
  cnpjAlphaInput.value = gerarCNPJAlfanumerico(
    document.getElementById('pontuar-cnpj-alpha').checked
  );
});

document.getElementById('cnpj-alpha-regen').addEventListener('click', () => {
  cnpjAlphaInput.value = gerarCNPJAlfanumerico(
    document.getElementById('pontuar-cnpj-alpha').checked
  );
});

document.getElementById('cnpj-alpha-copy').addEventListener('click', (e) => {
  if (!cnpjAlphaInput.value) return alert("Gere um CNPJ Alfa primeiro!");
  copyToClipboard(cnpjAlphaInput.value, e.currentTarget);
});
  </script>
</body>
</html>
