<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de CFPs e CNPJS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f9;
        }

        h1 {
            color: #333;
        }

        button {
            background-color: #090b09;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            font-size: 16px;
            border-radius: 5px;
        }

        button:hover {
            background-color: #090b09;
        }

        #cnpj-input, #cpf-input {
            font-size: 30px;
            text-align: center;
            margin: 20px 0px;
            min-height: 40px;
            padding: 5px;
            width: 100%;
            border: 2px solid #cecece;
            -webkit-box-shadow: 3px 4px 5px -1px rgba(0, 0, 0, 0.75);
            -moz-box-shadow: 3px 4px 5px -1px rgba(0, 0, 0, 0.75);
            box-shadow: 3px 4px 5px -1px rgba(0, 0, 0, 0.75);
        }

        .checkbox-label {
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h1>Gerador de CNPJ</h1>
    <p>Gerador de CNPJ válidos.</p>

    <input id="cnpj-input" disabled />
    <br />
    <label class="checkbox-label">
        <input type="checkbox" id="cnpj-format-checkbox" checked />
        Mostrar CNPJ com pontuação
    </label>
    <br /><br />
    <button onclick="gerarNovoCNPJ()">GERAR NOVO CNPJ</button>

    <script type="text/javascript">
        function gerarNovoCNPJ() {
            __cnpj(document.getElementById('cnpj-input'), document.getElementById('cnpj-format-checkbox').checked);
            jQuery("#cnpj-input").focus(function () { jQuery(this).select(); });
        }

        function __cnpj(a, comPontuacao) {
            var b = !0,
                c = 9,
                d = _r(c),
                e = _r(c),
                f = _r(c),
                g = _r(c),
                h = _r(c),
                i = _r(c),
                j = _r(c),
                k = _r(c),
                l = 0,
                m = 0,
                n = 0,
                o = 1,
                p = 2 * o + 3 * n + 4 * m + 5 * l + 6 * k + 7 * j + 8 * i + 9 * h + 2 * g + 3 * f + 4 * e + 5 * d;
            eval(' (p = 11 - _m(p, 11)) >= 10 && (p = 0); ');

            var q = 2 * p + 3 * o + 4 * n + 5 * m + 6 * l + 7 * k + 8 * j + 9 * i + 2 * h + 3 * g + 4 * f + 5 * e + 6 * d;
            eval(' q = 11 - _m(q, 11), q >= 10 && (q = 0), retorno = "", cnpj = b ? "" + d + e + "." + f + g + h + "." + i + j + k + "/" + l + m + n + o + "-" + p + q : "" + d + e + f + g + h + i + j + k + l + m + n + o + p + q, a.value = cnpj ');

            if (!comPontuacao) {
                a.value = a.value.replace(/[^\d]/g, '');
            }
        }

        function _r(a) {
            return Math.round(Math.random() * a)
        }

        function _m(a, b) {
            return Math.round(a - Math.floor(a / b) * b)
        }
    </script>

    <h1>Gerador de CPF</h1>
    <p>Gerador de CPF válidos.</p>

    <input id="cpf-input" disabled />
    <br />
    <label class="checkbox-label">
        <input type="checkbox" id="cpf-format-checkbox" checked />
        Mostrar CPF com pontuação
    </label>
    <br /><br />
    <button onclick="gerarNovoCPF()">GERAR NOVO CPF</button>

    <script type="text/javascript">
        function gerarNovoCPF() {
            var cpf = gerarCPF();
            var comPontuacao = document.getElementById('cpf-format-checkbox').checked;
            document.getElementById('cpf-input').value = comPontuacao ? cpf : cpf.replace(/[^\d]/g, '');
            jQuery("#cpf-input").focus(function () { jQuery(this).select(); });
        }

        function gerarCPF() {
            var cpfBase = [];
            for (var i = 0; i < 9; i++) {
                cpfBase.push(Math.floor(Math.random() * 10));
            }

            var digito1 = calcularDigito(cpfBase, 10);
            var digito2 = calcularDigito(cpfBase.concat(digito1), 11);

            return formatarCPF(cpfBase.concat(digito1, digito2));
        }

        function calcularDigito(cpfBase, peso) {
            var soma = 0;
            for (var i = 0; i < cpfBase.length; i++) {
                soma += cpfBase[i] * (peso - i);
            }
            var resto = soma % 11;
            return (resto < 2) ? 0 : 11 - resto;
        }

        function formatarCPF(cpf) {
            return cpf.slice(0, 3).join('') + '.' + cpf.slice(3, 6).join('') + '.' + cpf.slice(6, 9).join('') + '-' + cpf.slice(9, 11).join('');
        }
    </script>

</body>

</html>
