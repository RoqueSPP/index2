<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/styles.css"/>
    <meta name="description" content="FORMULÁRIOS COM HTML, CSS & JS!">
    <meta name="keywords" content="HTML, CSS, FORMULÁRIOS, JavaScript, Playwright, Cypress, Robot, Codeceptjs, Appium, Selenium, Pactum, Postman">
    <title>Pagina de testes</title>
       <h1>Página de Testes</h1>
</head>

<body>

  <form>
    <fieldset>
      <legend>Basic Information</legend>
      <div class="two-col">
        <div>
          <label for="firstname">Primeiro Nome</label>
          <input type="text" id="firstname" placeholder="Insert your full name" required>
        </div>
        <div>
          <label for="lastname">Ultimo Nome</label>
          <input type="text" id="lastname" placeholder="Insert your last name" required>
        </div>
        <div>
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Insert your password" required>
        </div>
        <div>
          <label for="age">Idade</label>
          <input type="number" id="age" placeholder="Insert your age" required>
        </div>
        <div>
          <label for="birth">Data de Nascimento</label>
          <input type="date" id="birth" required>
        </div>
        <div>
          <label for="height">Altura</label>
          <input type="text" id="height" placeholder="Insert your height" required>
        </div>
        <div>
          <label for="peso">Peso</label>
          <input type="text" id="peso" placeholder="Insert your weight" required>
        </div>
        <div>
          <label for="blood">Tipo Sanguineo</label>
          <input type="text" id="blood" placeholder="Insert your blood type" required>
        </div>
        <div>
          <label for="skin">Cor de Pele</label>
          <input type="text" id="skin" placeholder="Insert your skin color" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Informações Pessoais</legend>
      <div class="two-col">
        <div>
          <label for="cpf">CPF</label>
          <input type="number" id="cpf" placeholder="Insert your CPF" required>
        </div>
        <div>
          <label for="rg">RG</label>
          <input type="number" id="rg" placeholder="Insert your RG" required>
        </div>
        <div>
          <label for="phone">Telefone</label>
          <input type="number" id="phone" placeholder="Insert your phone" required>
        </div>
        <div>
          <label for="mobile">Celular</label>
          <input type="number" id="mobile" placeholder="Insert your mobile number" required>
        </div>
        <div>
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="Insert your best email" required>
        </div>
        <div>
          <label for="mather">Nome da Mãe</label>
          <input type="text" id="mather" placeholder="Mother full name" required>
        </div>
        <div>
          <label for="father">Nome do Pai</label>
          <input type="text" id="father" placeholder="Father full name" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Outras Informações</legend>
      <div class="two-col">
        <div>
          <label for="select1">Sexo</label>
          <select id="select1">
            <option>--Select--</option>
            <option value="male">Masculino</option>
            <option value="female">Feminino</option>
            <option value="noreply">Prefiro não Responder</option>
          </select>
        </div>
        <div>
          <label for="select2">Signo</label>
          <select id="select2">
            <option>--Select--</option>
            <option>Aries</option>
            <option>Touro</option>
            <option>Gêmeos</option>
            <option>Cancer</option>
            <option>Leão</option>
            <option>Virgem</option>
            <option>Libra</option>
            <option>Escorpião</option>
            <option>Sargitário</option>
            <option>Capricornio</option>
            <option>Aquario</option>
            <option>Peixes</option>
          </select>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <form>
      <label for="cep">CEP</label>
      <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000" autocomplete="postal-code">

      <label for="logradouro">Endereço</label>
      <input type="text" disabled id="logradouro" name="logradouro" placeholder="Rua, Avenida, etc.">
          
      <label for="Numero">Número</label>
      <input type="text" id="numero" name="numer" placeholder="numero.">

      <label for="bairro">Bairro</label>
      <input type="text" disabled id="bairro" name="bairro">

      <label for="cidade">Cidade</label>
      <input type="text" disabled id="cidade" name="cidade">

      <label for="uf">Estado (UF)</label>
      <input type="text" disabled id="uf" name="uf" maxlength="2">

      <div id="mensagem" class="error"></div>
    </form>
 <button type="button" id="btnValidate" onclick="validarFormulario()">
  Validar Preenchimento
</button>
  </form>
  </fieldset>
  <script>
    const cep = document.querySelector("#cep");
    const logradouro = document.querySelector("#logradouro");
    const bairro = document.querySelector("#bairro");
    const cidade = document.querySelector("#cidade");
    const uf = document.querySelector("#uf");
    const mensagem = document.querySelector("#mensagem");

    // Máscara do CEP: 00000-000
    cep.addEventListener("input", () => {
      let v = cep.value.replace(/\D/g, "").slice(0, 8);
      if (v.length > 5) v = v.slice(0, 5) + "-" + v.slice(5);
      cep.value = v;

      // Quando o usuário termina de digitar (8 dígitos), busca automaticamente
      if (v.length === 9) {
        buscarCEP(v.replace("-", ""));
      }
    });

    function buscarCEP(cepNumerico) {
      mensagem.textContent = "";
      fetch(`https://viacep.com.br/ws/${cepNumerico}/json/`)
        .then(resp => {
          if (!resp.ok) throw new Error("Erro ao consultar o CEP");
          return resp.json();
        })
        .then(data => {
          if (data.erro) {
            limparCampos();
            mensagem.textContent = "CEP não encontrado.";
          } else {
            logradouro.value = data.logradouro || "";
            bairro.value = data.bairro || "";
            cidade.value = data.localidade || "";
            uf.value = data.uf || "";
          }
        })
        .catch(() => {
          limparCampos();
          mensagem.textContent = "Erro ao buscar o CEP.";
        });
    }

    function limparCampos() {
      logradouro.value = "";
      bairro.value = "";
      cidade.value = "";
      uf.value = "";
    }
  </script>
    <script>
  function validarFormulario() {
    const camposObrigatorios = document.querySelectorAll(
      'input[required], select'
    );
    let formularioValido = true;
    let camposInvalidos = [];

    camposObrigatorios.forEach(campo => {
      if (
        campo.tagName === "SELECT" &&
        (campo.value === "" || campo.value === "--Select--")
      ) {
        formularioValido = false;
        camposInvalidos.push(campo);
      } else if (campo.tagName === "INPUT" && campo.value.trim() === "") {
        formularioValido = false;
        camposInvalidos.push(campo);
      }
    });

    if (!formularioValido) {
      alert("Por favor, preencha todos os campos obrigatórios corretamente.");
      // Destaque visual (opcional)
      camposInvalidos.forEach(campo => {
        campo.style.border = "2px solid red";
      });
    } else {
      // Redireciona se tudo estiver OK
      window.location.href = "https://roquespp.github.io/index2/testeFeito";
    }
  }
</script>

</body>

</html>
